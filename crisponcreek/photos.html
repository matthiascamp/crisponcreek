<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crisp on Creek — Product Photos</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f7f2;
  --surface:#fff;
  --forest:#1B4332;
  --forestM:#2D6A4F;
  --green:#40916C;
  --mint:#95D5B2;
  --lime:#D8F3DC;
  --pop:#e8693a;
  --text:#1a2e23;
  --textS:#4a6355;
  --border:rgba(27,67,50,.08);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;padding-bottom:120px}

/* Scanner Section */
.scanner-section{background:var(--forest);color:#fff;padding:20px 16px;text-align:center}
.scanner-section h1{font-size:1.2rem;margin-bottom:4px}
.scanner-section .subtitle{font-size:.8rem;opacity:.7;margin-bottom:16px}
.scan-input-wrap{display:flex;gap:8px;max-width:500px;margin:0 auto}
.scan-input{flex:1;padding:14px 16px;border:2px solid var(--mint);border-radius:12px;font-size:1.1rem;text-align:center;background:rgba(255,255,255,.1);color:#fff;outline:none;font-family:monospace;letter-spacing:1px}
.scan-input::placeholder{color:rgba(255,255,255,.4)}
.scan-input:focus{border-color:#fff;background:rgba(255,255,255,.15)}
.scan-go{padding:14px 20px;border:none;border-radius:12px;background:var(--pop);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}

/* Match result */
.scan-result{margin-top:16px;display:none;max-width:500px;margin-left:auto;margin-right:auto}
.scan-result.show{display:block}
.match-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px;text-align:left}
.match-name{font-size:1.1rem;font-weight:700}
.match-meta{font-size:.8rem;opacity:.7;margin-top:2px}
.match-actions{display:flex;gap:10px;margin-top:12px}
.match-photo-btn{flex:1;position:relative;padding:14px;border:2px dashed var(--mint);border-radius:12px;background:rgba(149,213,178,.15);color:#fff;font-size:.95rem;font-weight:600;text-align:center;cursor:pointer;overflow:hidden}
.match-photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.match-photo-btn.captured{border:2px solid var(--mint);background:rgba(149,213,178,.3)}
.match-skip{padding:14px 20px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:transparent;color:#fff;font-size:.9rem;cursor:pointer}
.scan-error{margin-top:12px;padding:10px 14px;background:rgba(232,105,58,.2);border:1px solid rgba(232,105,58,.4);border-radius:10px;font-size:.85rem;display:none}
.scan-error.show{display:block}
.scan-success{margin-top:12px;padding:10px 14px;background:rgba(149,213,178,.2);border:1px solid rgba(149,213,178,.4);border-radius:10px;font-size:.85rem;display:none}
.scan-success.show{display:block}

/* Stats bar */
.stats-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.stats{font-size:.85rem;color:var(--textS)}
.stats b{color:var(--green)}
.progress-mini{flex:1;max-width:120px;height:6px;background:var(--lime);border-radius:3px;margin:0 12px}
.progress-mini-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.mode-toggle{display:flex;gap:4px;background:var(--lime);border-radius:8px;padding:3px}
.mode-btn{padding:6px 12px;border:none;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;background:transparent;color:var(--textS)}
.mode-btn.active{background:var(--surface);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* Browse Section */
.browse-section{display:none}
.browse-section.show{display:block}

.controls{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:44px;z-index:90;background:rgba(241,247,242,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.search{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:.9rem;background:var(--surface);outline:none}
.search:focus{border-color:var(--green)}
.filter-btn{padding:7px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:.75rem;cursor:pointer;white-space:nowrap}
.filter-btn.active{background:var(--forest);color:#fff;border-color:var(--forest)}

.section-header{padding:8px 16px;background:var(--lime);font-size:.8rem;font-weight:600;color:var(--forest);position:sticky;top:96px;z-index:80}

.product{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.product.done{opacity:.45}

.rank{min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.7rem;font-weight:700;background:var(--lime);color:var(--forest)}
.rank.top20{background:var(--pop);color:#fff}
.rank.top50{background:var(--forest);color:#fff}

.product-info{flex:1;min-width:0}
.product-name{font-size:.85rem;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-meta{font-size:.7rem;color:var(--textS)}
.product-bc{font-family:monospace;font-size:.65rem;color:var(--green)}

.photo-btn{position:relative;width:50px;height:50px;border-radius:10px;border:2px dashed var(--mint);background:var(--lime);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden}
.photo-btn.has-photo{border:2px solid var(--green)}
.photo-btn img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.photo-btn .cam{font-size:1.2rem}
.photo-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Overlay */
.thumb-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
.thumb-overlay.show{display:flex}
.thumb-overlay img{max-width:100%;max-height:65vh;border-radius:12px}
.thumb-overlay .name{color:#fff;font-size:1rem;font-weight:600;text-align:center}
.thumb-overlay .actions{display:flex;gap:10px}
.thumb-overlay button{padding:10px 22px;border-radius:10px;border:none;font-size:.85rem;font-weight:600;cursor:pointer}
.btn-retake{background:rgba(255,255,255,.15);color:#fff}
.btn-close{background:var(--green);color:#fff}
.btn-delete{background:var(--pop);color:#fff}

/* FAB */
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px}
.fab button{padding:12px 20px;border:none;border-radius:14px;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.18)}
.download-btn{background:var(--forest);color:#fff}
.download-btn:disabled{opacity:.4}
.count-badge{background:var(--pop);color:#fff;min-width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;margin-left:6px}

.empty{padding:40px 20px;text-align:center;color:var(--textS)}

/* Recent captures strip */
.recent-strip{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.recent-strip h3{font-size:.8rem;color:var(--textS);margin-bottom:8px}
.recent-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.recent-thumb{width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0;cursor:pointer;border:2px solid var(--mint)}
.recent-thumb img{width:100%;height:100%;object-fit:cover}
.recent-label{font-size:.6rem;text-align:center;color:var(--textS);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
</style>
</head>
<body>

<!-- Scanner Mode -->
<div class="scanner-section" id="scannerSection">
  <h1>Crisp on Creek — Photo Capture</h1>
  <div class="subtitle">Scan barcode or search below</div>
  <div class="scan-input-wrap">
    <input class="scan-input" type="text" id="scanInput" placeholder="Scan barcode..." inputmode="numeric" autofocus>
    <button class="scan-go" id="scanGo">Go</button>
  </div>
  <div class="scan-result" id="scanResult">
    <div class="match-card">
      <div class="match-name" id="matchName"></div>
      <div class="match-meta" id="matchMeta"></div>
      <div class="match-actions">
        <label class="match-photo-btn" id="matchPhotoBtn">
          Take Photo
          <input type="file" accept="image/*" capture="environment" id="matchPhotoInput">
        </label>
        <button class="match-skip" id="matchSkip">Next</button>
      </div>
    </div>
  </div>
  <div class="scan-error" id="scanError"></div>
  <div class="scan-success" id="scanSuccess"></div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stats"><span id="doneCount">0</span>/<span id="totalCount">0</span> <b id="pctDone"></b></div>
  <div class="progress-mini"><div class="progress-mini-fill" id="progressFill"></div></div>
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="scan">Scan</button>
    <button class="mode-btn" data-mode="browse">Browse</button>
  </div>
</div>

<!-- Recent Captures -->
<div class="recent-strip" id="recentStrip" style="display:none">
  <h3>Recent captures</h3>
  <div class="recent-thumbs" id="recentThumbs"></div>
</div>

<!-- Browse Mode -->
<div class="browse-section" id="browseSection">
  <div class="controls">
    <input class="search" type="search" placeholder="Search products..." id="searchInput">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="todo">To Do</button>
    <button class="filter-btn" data-filter="done">Done</button>
    <button class="filter-btn" data-cat="Fruit & Veg">Fruit&Veg</button>
    <button class="filter-btn" data-cat="Grocery">Grocery</button>
    <button class="filter-btn" data-cat="Deli">Deli</button>
  </div>
  <div id="productList"></div>
</div>

<!-- Image Overlay -->
<div class="thumb-overlay" id="overlay">
  <div class="name" id="overlayName"></div>
  <img id="overlayImg" src="">
  <div class="actions">
    <button class="btn-retake" id="btnRetake">Retake</button>
    <button class="btn-delete" id="btnDelete">Delete</button>
    <button class="btn-close" id="btnClose">Close</button>
  </div>
</div>

<!-- Download FAB -->
<div class="fab">
  <button class="download-btn" id="downloadBtn" disabled>
    Download ZIP <span class="count-badge" id="countBadge">0</span>
  </button>
</div>

// Build barcode lookup
const barcodeMap = {};
const pcodeMap = {};
for (const p of PRODUCTS) {
  pcodeMap[p.p] = p;
  if (p.b) barcodeMap[p.b] = p;
}

// IndexedDB
const DB_NAME = 'crispPhotos';
const DB_VERSION = 1;
const STORE_NAME = 'photos';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE_NAME, { keyPath: 'pcode' });
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}
function savePhoto(pcode, blob) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put({ pcode, blob, ts: Date.now() });
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
function getPhoto(pcode) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(pcode);
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}
function deletePhoto(pcode) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(pcode);
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
function getAllPhotoPcodes() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAllKeys();
    req.onsuccess = () => resolve(new Set(req.result));
    req.onerror = reject;
  });
}
function getAllPhotos() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = reject;
  });
}

function resizeImage(file, maxDim) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.85);
    };
    img.src = url;
  });
}

let donePcodes = new Set();
let recentCaptures = [];
let currentFilter = 'all';
let currentCat = null;
let searchTerm = '';
let overlayPcode = null;
let currentMatch = null;

function rankClass(r) {
  if (r <= 20) return 'top20';
  if (r <= 50) return 'top50';
  return '';
}

function updateStats() {
  const total = PRODUCTS.length;
  const done = donePcodes.size;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pctDone').textContent = total ? `(${Math.round(done/total*100)}%)` : '';
  document.getElementById('progressFill').style.width = total ? `${done/total*100}%` : '0';
  document.getElementById('countBadge').textContent = done;
  document.getElementById('downloadBtn').disabled = done === 0;
}

// ---- Scanner Mode ----
const scanInput = document.getElementById('scanInput');
const scanResult = document.getElementById('scanResult');
const scanError = document.getElementById('scanError');
const scanSuccess = document.getElementById('scanSuccess');

function lookupBarcode(code) {
  code = code.trim();
  if (!code) return null;
  // Try exact barcode match
  if (barcodeMap[code]) return barcodeMap[code];
  // Try pcode match
  if (pcodeMap[code]) return pcodeMap[code];
  // Try partial barcode match (some scanners add leading zeros)
  const stripped = code.replace(/^0+/, '');
  for (const [bc, p] of Object.entries(barcodeMap)) {
    if (bc.replace(/^0+/, '') === stripped) return p;
  }
  return null;
}

function doScan() {
  const code = scanInput.value.trim();
  scanError.classList.remove('show');
  scanSuccess.classList.remove('show');
  scanResult.classList.remove('show');

  if (!code) { scanInput.focus(); return; }

  const product = lookupBarcode(code);
  if (!product) {
    scanError.textContent = `No match for "${code}" — try browsing the list instead`;
    scanError.classList.add('show');
    scanInput.value = '';
    scanInput.focus();
    return;
  }

  if (donePcodes.has(product.p)) {
    scanSuccess.textContent = `"${product.n}" already has a photo! Scan next item.`;
    scanSuccess.classList.add('show');
    scanInput.value = '';
    scanInput.focus();
    return;
  }

  currentMatch = product;
  document.getElementById('matchName').textContent = product.n;
  document.getElementById('matchMeta').textContent = `#${product.r} · ${product.c} · $${product.s.toLocaleString()} sales · ${product.p}`;
  document.getElementById('matchPhotoBtn').classList.remove('captured');
  document.getElementById('matchPhotoBtn').innerHTML = 'Take Photo<input type="file" accept="image/*" capture="environment" id="matchPhotoInput">';
  document.getElementById('matchPhotoInput').addEventListener('change', handleMatchPhoto);
  scanResult.classList.add('show');
}

scanInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); doScan(); }
});
document.getElementById('scanGo').addEventListener('click', doScan);

document.getElementById('matchSkip').addEventListener('click', () => {
  scanResult.classList.remove('show');
  scanInput.value = '';
  scanInput.focus();
  currentMatch = null;
});

async function handleMatchPhoto(e) {
  const file = e.target.files[0];
  if (!file || !currentMatch) return;
  const blob = await resizeImage(file, 1200);
  await savePhoto(currentMatch.p, blob);
  donePcodes.add(currentMatch.p);

  recentCaptures.unshift({ pcode: currentMatch.p, name: currentMatch.n, blob });
  if (recentCaptures.length > 20) recentCaptures.pop();
  updateRecentStrip();
  updateStats();

  document.getElementById('matchPhotoBtn').classList.add('captured');
  document.getElementById('matchPhotoBtn').innerHTML = 'Done! Photo saved<input type="file" accept="image/*" capture="environment" id="matchPhotoInput">';

  scanSuccess.textContent = `Photo saved for "${currentMatch.n}"! Scan next item.`;
  scanSuccess.classList.add('show');

  setTimeout(() => {
    scanResult.classList.remove('show');
    scanInput.value = '';
    scanInput.focus();
    currentMatch = null;
  }, 1200);
}

// ---- Recent captures strip ----
function updateRecentStrip() {
  const strip = document.getElementById('recentStrip');
  const container = document.getElementById('recentThumbs');
  if (recentCaptures.length === 0) { strip.style.display = 'none'; return; }
  strip.style.display = 'block';
  container.innerHTML = recentCaptures.map(c => `
    <div>
      <div class="recent-thumb" data-pcode="${c.pcode}">
        <img src="${URL.createObjectURL(c.blob)}">
      </div>
      <div class="recent-label">${c.name}</div>
    </div>
  `).join('');
  container.querySelectorAll('.recent-thumb').forEach(el => {
    el.addEventListener('click', () => showOverlay(el.dataset.pcode));
  });
}

// ---- Mode Toggle ----
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    document.getElementById('scannerSection').style.display = mode === 'scan' ? 'block' : 'none';
    document.getElementById('browseSection').classList.toggle('show', mode === 'browse');
    if (mode === 'scan') scanInput.focus();
    if (mode === 'browse') renderList();
  });
});

// ---- Browse Mode ----
function renderList() {
  const list = document.getElementById('productList');
  let filtered = PRODUCTS;

  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    filtered = filtered.filter(p => p.n.toLowerCase().includes(q) || p.p.includes(q) || (p.b && p.b.includes(q)));
  }
  if (currentCat) {
    filtered = filtered.filter(p => p.c === currentCat);
  }
  if (currentFilter === 'todo') {
    filtered = filtered.filter(p => !donePcodes.has(p.p));
  } else if (currentFilter === 'done') {
    filtered = filtered.filter(p => donePcodes.has(p.p));
  }

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">No products match.</div>';
    return;
  }

  let lastCat = '';
  let html = '';
  for (const p of filtered) {
    if (p.c !== lastCat) {
      lastCat = p.c;
      html += `<div class="section-header">${p.c}</div>`;
    }
    const isDone = donePcodes.has(p.p);
    html += `
      <div class="product ${isDone ? 'done' : ''}" data-pcode="${p.p}">
        <div class="rank ${rankClass(p.r)}">#${p.r}</div>
        <div class="product-info">
          <div class="product-name">${p.n}</div>
          <div class="product-meta">${p.p} · $${p.s.toLocaleString()}</div>
          ${p.b ? `<div class="product-bc">${p.b}</div>` : ''}
        </div>
        <label class="photo-btn ${isDone ? 'has-photo' : ''}" id="btn-${p.p}">
          ${isDone ? `<img src="" data-pcode="${p.p}" class="thumb">` : '<span class="cam">📷</span>'}
          <input type="file" accept="image/*" capture="environment" data-pcode="${p.p}">
        </label>
      </div>`;
  }
  list.innerHTML = html;

  list.querySelectorAll('.thumb').forEach(async img => {
    const photo = await getPhoto(img.dataset.pcode);
    if (photo) img.src = URL.createObjectURL(photo.blob);
  });
  list.querySelectorAll('input[type=file]').forEach(input => {
    input.addEventListener('change', handleBrowsePhoto);
  });
  list.querySelectorAll('.thumb').forEach(img => {
    img.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      showOverlay(img.dataset.pcode);
    });
  });
}

async function handleBrowsePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const pcode = e.target.dataset.pcode;
  const blob = await resizeImage(file, 1200);
  await savePhoto(pcode, blob);
  donePcodes.add(pcode);
  const product = pcodeMap[pcode];
  recentCaptures.unshift({ pcode, name: product ? product.n : pcode, blob });
  if (recentCaptures.length > 20) recentCaptures.pop();
  updateRecentStrip();
  updateStats();
  renderList();
}

    currentCat = currentCat === btn.dataset.cat ? null : btn.dataset.cat;
    currentFilter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (currentCat) btn.classList.add('active');
    else document.querySelector('[data-filter="all"]').classList.add('active');
    renderList();
  });
});
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  renderList();
});

// ---- Overlay ----
async function showOverlay(pcode) {
  const photo = await getPhoto(pcode);
  if (!photo) return;
  const product = pcodeMap[pcode];
  overlayPcode = pcode;
  document.getElementById('overlayName').textContent = product ? product.n : pcode;
  document.getElementById('overlayImg').src = URL.createObjectURL(photo.blob);
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('btnClose').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  overlayPcode = null;
});
document.getElementById('btnRetake').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  if (overlayPcode) {
    const input = document.querySelector(`input[data-pcode="${overlayPcode}"]`);
    if (input) input.click();
  }
  overlayPcode = null;
});
document.getElementById('btnDelete').addEventListener('click', async () => {
  if (overlayPcode) {
    await deletePhoto(overlayPcode);
    donePcodes.delete(overlayPcode);
    recentCaptures = recentCaptures.filter(c => c.pcode !== overlayPcode);
    updateRecentStrip();
    updateStats();
    renderList();
  }
  document.getElementById('overlay').classList.remove('show');
  overlayPcode = null;
});

// ---- Download ZIP ----
document.getElementById('downloadBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadBtn');
  btn.textContent = 'Zipping...';
  btn.disabled = true;
  const photos = await getAllPhotos();
  const zip = new JSZip();
  for (const photo of photos) {
    const product = pcodeMap[photo.pcode];
    const safeName = product ? product.n.replace(/[^a-zA-Z0-9 ]/g, '').replace(/\s+/g, '_') : photo.pcode;
    zip.file(`${photo.pcode}_${safeName}.jpg`, photo.blob);
  }
  const content = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = `crisp_photos_${new Date().toISOString().slice(0,10)}.zip`;
  a.click();
  btn.innerHTML = 'Download ZIP <span class="count-badge">' + donePcodes.size + '</span>';
  btn.disabled = false;
});

// ---- Init ----
(async () => {
  await openDB();
  donePcodes = await getAllPhotoPcodes();
  updateStats();
})();
</script>
</body>
